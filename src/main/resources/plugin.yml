name: CInvMenu
version: '${project.version}'
main: com.cinvmenu.CInvMenu
api-version: '1.20'
author: PluginDeveloper
description: Creative-style item menu for selected Survival players
commands:
  cinv:
    description: Manage players who can use the creative inventory menu
    usage: /cinv <user select|remove|list> [player]
    permission: cinvmenu.admin
  cmenu:
    description: Open the creative item menu (selected players only)
    usage: /cmenu
permissions:
  cinvmenu.admin:
    description: Allows using /cinv to select/remove/list players
    default: op
